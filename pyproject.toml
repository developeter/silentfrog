[project]
name = "silentfrog"
version = "1.0.0"
description = ""
authors = [
    {name = "Developeter",email = "developeter.apps@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pyside6 (>=6.8,<7.0)",
    "qtpy (>=2.4.3,<3.0.0)",
    "numpy (>=2.2.6,<3.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "urllib3 (>=2.4.0,<3.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "openpyxl (>=3.1)",
    "httpx[http2] (>=0.28.1,<0.29.0)",
    "beautifulsoup4 (>=4.13.4,<5.0.0)",
    # lxml 6.x publishes wheels for Python 3.12/3.13/3.14 on the CI targets we support.
    "lxml (>=6.0.2,<7.0)",
    # Pure-Python parser used by schema extraction fallbacks.
    "html5lib (>=1.1,<2.0)",
    "tldextract (>=5.3.0,<6.0.0)",
    "xlsxwriter (>=3.2.9,<4.0.0)",
    "aiohttp (>=3.12.0,<4.0.0)",
    "certifi (>=2025.1.31,<2027.0.0)",
    "nltk (>=3.9.1,<4.0.0)",
    # Pillow 12.2.x publishes Windows/macOS wheels for Python 3.14.
    "pillow (>=12.2.0,<13.0.0)",
    "humanize (>=4.12.3,<5.0.0)",
    # Structured data extraction. Imported at runtime by
    # `silentfrog.schema_extractor`; the `USE_EXTRUCT` guard hides — not
    # removes — that requirement. w3lib is a transitive dep of extruct but
    # we pin it directly so the runtime contract is explicit.
    "extruct (>=0.16.0,<0.17.0)",
    "w3lib (>=2.1.0,<3.0.0)"
]

[project.gui-scripts]
# Use `gui-scripts` (not `scripts`) so pip's Windows wrapper is the
# windowed launcher (`pythonw.exe`-style, PE subsystem 2). With the
# regular `scripts` entry the launcher is a console binary and Windows
# briefly flashes a `cmd` window on every double-click.
silentfrog = "silentfrog.gui:main"

[project.optional-dependencies]
pyqt5-backend = [
    "pyqt5 (==5.15.11)",
    "pyqt5-sip (>=12.11,<13)",
]
# Optional Chromium-backed SSR parity check used by the GEO Visibility
# audit (see docs/geo_roadmap.md §M4). After `pip install
# silentfrog[geo-render]` run `playwright install chromium` to fetch the
# browser bundle. When the extra is missing, the parity row reports
# "not measured" and does NOT down-weight the AI Visibility verdict.
geo-render = [
    "playwright (>=1.43,<2.0)",
]

[tool.poetry]
packages = [{include = "silentfrog", from = "src"}]


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
requests-mock = "^1.12.1"
nltk = "^3.9.1"
pytest-asyncio = "^1.0.0"
pytest-aiohttp = "^1.1.0"
pytest-qt = "^4.4.0"
ruff = ">=0.6,<1.0"
mypy = ">=1.10,<2.0"
coverage = ">=7.0,<8.0"
diff-cover = ">=9.0,<10.0"
pytest-cov = ">=6.0,<8.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Scope discovery to the supported tests/ tree so archived modules
# under experimental/ (kept for historical reference) aren't picked up.
testpaths = ["tests"]

# v1.1 N3b — quality gates.
# Ramp policy (see AGENTS.md §8 and docs/geo_roadmap.md v1.1 §N3b):
# ruff is strict from day one (auto-fix lands in a dedicated commit
# before the gate wires into doctor). mypy starts with strict_optional
# only and tightens per folder over time. Coverage threshold is
# enforced per touched file via diff-cover, not as a global percent.

[tool.ruff]
# 120 reflects the project's de-facto norm — most user-facing tooltip
# strings in ai_visibility.py and content_quality.py sit in the
# 111-128 char range and breaking them mid-sentence hurts readability.
# The plan's original 110 was a coin-toss; landing at 120 keeps the
# strict-from-day-one principle without forcing churn on verbose
# tooltips.
line-length = 120
target-version = "py312"
extend-exclude = [
    "experimental",
    ".venv",
    "build",
    "deploy",
    ".claude/worktrees",
]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, B = bugbear,
# UP = pyupgrade, C4 = comprehensions.
select = ["E", "F", "W", "I", "B", "UP", "C4"]
# AGENTS.md §1 rule "no destructive shortcuts" preserved; we keep
# E501 (line length) enforced and a small set of pragmatic ignores.
ignore = [
    "B008",   # function calls in argument defaults are intentional in some helpers
    "UP007",  # prefer Union over | in mixed pre-3.10 type hints in shared code paths
    "UP045",  # same — Optional vs | None mixed-style allowed during gradual ramp
]

[tool.ruff.lint.per-file-ignores]
# Tests use pytest fixtures whose names shadow imports by design.
"tests/**" = ["B011", "B017", "E501", "E402"]
# Tools / hooks: legacy shell-style scripts, longer lines allowed; sys.path
# manipulation before imports is intentional in tools/.
"tools/**" = ["E501", "E402"]
".claude/hooks/**" = ["E501"]
# Long user-facing tooltip / GUI label strings. Breaking them mid-sentence
# hurts readability; the long-line rule isn't enforced on these files.
"src/silentfrog/tabs.py" = ["E501"]
"src/silentfrog/perf_metrics.py" = ["E501"]
"src/silentfrog/site_crawl_history_gui.py" = ["E501"]
"src/silentfrog/ai_visibility.py" = ["E501"]
"src/silentfrog/ai_review.py" = ["E501"]
"src/silentfrog/content_quality.py" = ["E501"]
# Legacy enums kept as `class X(str, Enum)` instead of `StrEnum` — the
# value semantics changed in 3.11 and migrating would require behaviour
# verification against pickled state on disk.
"src/silentfrog/audit_issues.py" = ["UP042"]
"src/silentfrog/remote_sync.py" = ["UP042"]
"src/silentfrog/updater.py" = ["UP042"]

[tool.ruff.format]
# Mirrors black's defaults; explicit so contributors don't need to
# look it up.
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
# Gradual ramp: strict on optional handling only. Tightening per
# folder lives in follow-up PRs (see AGENTS.md §8 for the policy).
strict_optional = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
# Permissive everywhere else for now.
disallow_untyped_defs = false
disallow_any_generics = false
check_untyped_defs = true
# Exclude experimental archive and generated dirs.
exclude = [
    "^experimental/",
    "^build/",
    "^deploy/",
    "^\\.venv/",
    "^\\.claude/worktrees/",
]

[tool.coverage.run]
source = ["src/silentfrog"]
branch = true
omit = [
    "src/silentfrog/__main__.py",
    "src/silentfrog/gui.py",  # GUI bootstrapping: covered by manual smoke
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
skip_covered = false
show_missing = true
