name: Python Compatibility

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  compatibility:
    runs-on: ${{ matrix.os }}
    name: compatibility (${{ matrix.label }}, ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            python-version: "3.12"
          - os: windows-latest
            label: windows-x64
            python-version: "3.13"
          - os: windows-latest
            label: windows-x64
            python-version: "3.14"
          - os: macos-15-intel
            label: macos-intel
            python-version: "3.12"
          - os: macos-15-intel
            label: macos-intel
            python-version: "3.13"
          - os: macos-15-intel
            label: macos-intel
            python-version: "3.14"
          - os: macos-15
            label: macos-apple-silicon
            python-version: "3.12"
          - os: macos-15
            label: macos-apple-silicon
            python-version: "3.13"
          - os: macos-15
            label: macos-apple-silicon
            python-version: "3.14"
    env:
      QT_API: pyside6
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      POETRY_VIRTUALENVS_CREATE: "true"
    steps:
      # SHA-pinned to avoid supply-chain risk from mutable Action tags.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
      # Safer than a third-party Action: install Poetry directly with pip.
      - name: Install Poetry
        run: pip install poetry==2.1.4
      - name: Install dependencies
        run: poetry install
      - name: Dependency install smoke
        run: poetry run python -c "from qtpy import API_NAME; import silentfrog; print(API_NAME)"
      - name: Unit smoke
        run: poetry run pytest -q tests/test_sanity.py tests/test_http_client.py tests/test_source_install_unit.py tests/test_updater_unit.py tests/test_update_silentfrog_unit.py tests/test_source_update_unit.py
      - name: GUI smoke
        run: poetry run pytest -q tests/test_qt_runtime_smoke.py tests/test_seo_gui.py -k "seo_window_primary_controls_exist or seo_window_configures_scrollable_tabs"
      - name: Crawl smoke
        run: poetry run pytest -q tests/test_seo_crawler.py -k "test_analyse"
      - name: Source installer smoke
        run: poetry run python install_silentfrog.py --recreate-venv
      - name: Installed app smoke
        run: poetry run python tools/source_install_smoke.py
      - name: Doctor (venv mode)
        run: poetry run python tools/doctor.py --mode venv --skip-tests
