name: Release Bootstrap

# Attaches the three bootstrap files (the Windows .bat + .ps1 pair and
# the macOS .command) to the GitHub Release that matches each pushed
# `v*` tag, so users can download a one-click installer matching their
# platform. The workflow is intentionally lightweight: no build step, no
# matrix; the bootstrap scripts are plain text already committed in
# `bootstrap/`.
#
# H7/PR-18 — signed-update assets (added by the maintainer, NOT this
# workflow): the in-app updater (tools/update_silentfrog.py) targets the
# latest signed Release and refuses to install unless the release carries a
# minisign-signed manifest verified against the public key pinned in
# src/silentfrog/update_trust.py. The signing key never touches CI: the
# maintainer signs the manifest OFFLINE and attaches three more assets to
# this (draft) release before publishing it —
#   * <source-archive>.zip   (the exact archive the manifest hashes)
#   * manifest.json          (format 1: tag + source/installer SHA-256)
#   * manifest.json.minisig  (minisign signature of manifest.json)
# Until a key is pinned and a release is signed, the updater fails closed
# (refuses every update). See the release procedure in docs / the PR notes.

on:
  workflow_dispatch:
    inputs:
      draft:
        description: >-
          Publish as a draft release (default) instead of published
          immediately. Keep this true until a signed manifest.json +
          manifest.json.minisig exist to attach — see the note above,
          docs/RELEASING.md, and docs/v2_0_release_roadmap.md §2
          ("keep releases as drafts"): a published release with no
          signed manifest 404s for every user's updater and returns
          EXIT_UNVERIFIED.
        required: false
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned to avoid supply-chain risk from mutable Action tags.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Publish bootstrap files to GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda  # v2.2.1
        with:
          files: |
            bootstrap/Get-Silentfrog.bat
            bootstrap/Get-Silentfrog.ps1
            bootstrap/Get-Silentfrog.command
          fail_on_unmatched_files: true
          # Draft by default (tag-push runs always draft; a manual
          # workflow_dispatch run can opt into publishing immediately via
          # the `draft` input above). See docs/v2_0_release_roadmap.md §2.
          draft: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
