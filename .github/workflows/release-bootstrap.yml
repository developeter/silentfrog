name: Release Bootstrap

# Attaches the three bootstrap files (the Windows .bat + .ps1 pair and
# the macOS .command) to the GitHub Release that matches each pushed
# `v*` tag, so users can download a one-click installer matching their
# platform. The workflow is intentionally lightweight: no build step, no
# matrix; the bootstrap scripts are plain text already committed in
# `bootstrap/`.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned to avoid supply-chain risk from mutable Action tags.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Publish bootstrap files to GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda  # v2.2.1
        with:
          files: |
            bootstrap/Get-Silentfrog.bat
            bootstrap/Get-Silentfrog.ps1
            bootstrap/Get-Silentfrog.command
          fail_on_unmatched_files: true
          draft: true
