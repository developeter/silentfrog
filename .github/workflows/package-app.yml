name: Package App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      QT_API: pyside6
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      POETRY_VIRTUALENVS_CREATE: "true"
    steps:
      # SHA-pinned per prevenire supply-chain attack via Actions tag mutabili
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2de359ef6213f08223a  # v5.3.0
        with:
          python-version: "3.12"
      # Alternativa sicura: pip install diretta invece di Action di terze parti
      - name: Install Poetry
        run: pip install poetry==2.1.4
      - name: Install dependencies
        run: poetry install
      - name: Build packaged application
        run: poetry run python tools/package_app.py --mode standalone --keep-deployment-files
      - name: Upload package artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf8b  # v4.6.0
        with:
          name: silentfrog-${{ matrix.os }}
          path: deploy/deployment
