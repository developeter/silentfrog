name: Package App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ${{ matrix.os }}
    name: package (${{ matrix.artifact-name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: Silentfrog-windows-x64
          - os: macos-15-intel
            artifact-name: Silentfrog-macos-intel
          - os: macos-15
            artifact-name: Silentfrog-macos-apple-silicon
    env:
      QT_API: pyside6
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      POETRY_VIRTUALENVS_CREATE: "true"
    steps:
      # SHA-pinned to avoid supply-chain risk from mutable Action tags.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2de359ef6213f08223a  # v5.3.0
        with:
          python-version: "3.14"
      # Safer than a third-party Action: install Poetry directly with pip.
      - name: Install Poetry
        run: pip install poetry==2.1.4
      - name: Install dependencies
        run: poetry install
      - name: Build packaged application + distribution artifact
        run: poetry run python tools/package_app.py --mode standalone --keep-deployment-files
      - name: Upload inspection artifacts (build directory)
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf8b  # v4.6.0
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            build/package/*/Silentfrog-*.dmg
            build/package/*/Silentfrog-*.zip
          if-no-files-found: error
      - name: Publish to GitHub Releases on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda  # v2.2.1
        with:
          files: |
            build/package/*/Silentfrog-*.dmg
            build/package/*/Silentfrog-*.zip
          fail_on_unmatched_files: true
          draft: true
